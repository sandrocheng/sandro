<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>03-表格属性</title>
</head>

<body>
  <table border="1" align="center" cellpadding="5" cellspacing="15" width="70%">
    <tr>
      <!--表头标签-->
      <th>数据列名1</th>
      <th>数据列名2</th>
      <th>数据列名3</th>
      <th>数据列名4</th>
      <th>数据列名5</th>
    </tr>
    <tr>
      <td>数据1-1</td>
      <td>数据1-2</td>
      <td>数据1-3</td>
      <td>数据1-4</td>
      <td>数据1-5</td>
    </tr>
    <tr>
      <td>数据2-1</td>
      <td>数据2-2</td>
      <td>数据2-3</td>
      <td>数据2-4</td>
      <td>数据2-5</td>
    </tr>
  </table>

  <table border="1" align="center" cellpadding="5" cellspacing="0" width="70%" height="350">
    <tr>
      <!--表头标签-->
      <th>数据列名1</th>
      <th>数据列名2</th>
      <th>数据列名3</th>
      <th>数据列名4</th>
      <th>数据列名5</th>
    </tr>
    <tr>
      <td>数据1-1</td>
      <td>数据1-2</td>
      <td>数据1-3</td>
      <td>数据1-4</td>
      <td>数据1-5</td>
    </tr>
    <tr>
      <td>数据2-1</td>
      <td>数据2-2</td>
      <td>数据2-3</td>
      <td>数据2-4</td>
      <td>数据2-5</td>
    </tr>
  </table>
</body>

</html>
