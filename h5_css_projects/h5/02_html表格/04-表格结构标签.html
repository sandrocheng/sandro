<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>04-表格结构标签</title>
</head>

<body>
  <table border="1" align="center" cellpadding="5" cellspacing="0" width="70%">
    <thead>
      <tr>
        <th>数据列名1</th>
        <th>数据列名2</th>
        <th>数据列名3</th>
        <th>数据列名4</th>
        <th>数据列名5</th>
      </tr>
    </thead>

    <tbody>
      <tr>
        <td>数据1-1</td>
        <td>数据1-2</td>
        <td>数据1-3</td>
        <td>数据1-4</td>
        <td>数据1-5</td>
      </tr>
      <tr>
        <td>数据2-1</td>
        <td>数据2-2</td>
        <td>数据2-3</td>
        <td>数据2-4</td>
        <td>数据2-5</td>
      </tr>
    </tbody>

  </table>
</body>

</html>
