<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>03-label标签</title>
</head>

<body>

  <div>
    <label for="radio1">点击这里</label><input name="testradio" type="radio" id="radio1" />
    <label for="radio2">点击这里</label><input name="testradio" type="radio" id="radio2" />
  </div>

  <div>
    <label for="inputText">点击这里</label><input name="testradio" type="text" id="inputText" />
  </div>

  <div>
    <label for="checkbox1">点击这里</label><input type="checkbox" id="checkbox1" />
    <label for="checkbox2">点击这里</label><input type="checkbox" id="checkbox2" />
  </div>
</body>

</html>
