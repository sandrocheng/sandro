<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>01-CSS语法规则</title>
  <style>
    p {
      color: red;
      font-size: 25px;
    }

    h1 {
      color: rgb(16, 206, 57);
    }

    div {
      color: rgb(104, 8, 215);
      font-size: 25px;
    }
  </style>
</head>

<body>
  <p>p标签内容</p>
  <h1>h1标签内容</h1>
  <div>div标签内容</div>
</body>

</html>
