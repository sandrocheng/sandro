<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>02-类选择器</title>
  <style>
    .single {
      color: red;
    }

    .big {
      font-size: 35px;
    }
  </style>
</head>

<body>
  <ul>
    <li class="single">第一条</li>
    <li>第二条</li>
    <li class="single">第三条</li>
    <li>第四条</li>
    <li class="single ">第五条</li>
  </ul>
  <div class="single big"> 使用single 和 big类的div标签</div>
</body>

</html>
