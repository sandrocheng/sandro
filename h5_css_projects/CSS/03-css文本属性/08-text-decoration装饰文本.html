<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>08-text-decoration装饰文本</title>
  <style>
    p {
      text-decoration: underline;
    }

    span {
      text-decoration: overline;
    }

    div {
      text-decoration: line-through;
    }

    a {
      text-decoration: none
    }
  </style>
</head>

<body>
  <p>下划线</p>
  <span>上划线</span>
  <div>删除线</div>

  <a href="#">没有下划线的链接</a>
</body>

</html>
