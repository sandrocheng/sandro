<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>03-font-weight设置字体粗细</title>
  <style>
    .bold {
      font-weight: bold;
    }

    .lighter {
      font-weight: lighter;
    }

    .bolder {
      font-weight: bolder;
    }

    .n100 {
      font-weight: 100;
    }

    .n900 {
      font-weight: 900;
    }
  </style>
</head>

<body>
  <p>正常font-weight字体</p>
  <p class="bold">bold font-weight字体</p>
  <p class="lighter">lighter font-weight字体</p>
  <p class="bolder">bolder font-weight字体</p>
  <p class="n100">100字体 font-weight字体</p>
  <p class="n900">900字体 font-weight字体</p>

</body>

</html>
