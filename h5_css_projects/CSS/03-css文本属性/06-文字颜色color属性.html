<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>06-文字颜色color属性</title>
  <style>
    p {
      color: red;
    }

    span {
      color: rgb(255, 0, 155)
    }

    div {
      color: rgb(50%, 0%, 50%)
    }

    h1 {
      color: #0000aa
    }
  </style>
</head>


<body>
  <p>color:red</p>
  <span>rgb(255, 0, 155)</span>
  <div>rgb(50%,0%,50%)</div>
  <h1>#0000aa</h1>
</body>

</html>
