<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>01-font-family设置字体</title>
  <style>
    h2 {
      font-family: "宋体";
    }

    h3 {
      font-family: "微软雅黑";
    }

    p {
      font-family: Arial, "Microsoft Yahei", "微软雅黑";
    }
  </style>
</head>


<body>
  <h2>宋体</h2>
  <h3>微软雅黑</h3>
  <p>Arial, "Microsoft Yahei", "微软雅黑"</p>
</body>

</html>
