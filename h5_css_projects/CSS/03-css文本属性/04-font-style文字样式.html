<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>04-font-style文字样式</title>
  <style>
    p {
      font-style: italic;
    }

    em {
      font-style: normal;
    }
  </style>
</head>

<body>
  <p>italic文字样式</p>
  <em>em标签字体不倾斜</em>
</body>

</html>
