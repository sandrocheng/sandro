<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>05-font复合属性写法</title>
  <style>
    span {
      font: italic 700 20px/20px 'Microsoft yahei';
    }

    p {
      font: 25px 'Microsoft yahei';
    }
  </style>
</head>

<body>
  <span>倾斜 加粗 20号字 行间距20 微软雅黑</span>
  <p>25号字 微软雅黑</p>
</body>

</html>
