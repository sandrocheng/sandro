<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Complatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>01-创建一个vue实例</title>
  <script src="../lib/vue2.js"></script>
</head>

<body>


  <div id="app">
    <h1>{{msg}}</h1>
  </div>

  <script>
    const app = new Vue({
      el: "#app",
      data: {
        msg: 'Hello Vue'
      }
    })
  </script>

</body>

</html>
