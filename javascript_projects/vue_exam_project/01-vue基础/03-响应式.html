<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Complatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>03-响应式</title>
  <script src="../lib/vue2.js"></script>
</head>

<body>


  <div id="app">
    <h1>{{msg}}</h1>
  </div>

  <script>
    const app = new Vue({
      el: "#app",
      data: {
        msg: 'Hello Vue 0'
      }
    })

    let i = 0

    setInterval(function () {
      i++
      app.msg = 'Hello Vue ' + i
      console.log(i);

    }, 1000)
  </script>

</body>

</html>
