<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Complatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>03-v-else指令</title>
  <script src="../lib/vue2.js"></script>
</head>

<body>
  <div id="app">
    <button>{{btnValue}}</button>
    <div v-if="gender===1" class="box">男</div>
    <div v-else class="box">女</div>
  </div>

  <script>
    const app = new Vue({
      el: "#app",
      data: {
        gender: 0,
        btnValue: '切换性别'
      }
    })

    const btn = document.querySelector('button')
    btn.addEventListener('click', function () {
      app.gender = app.gender === 1 ? 0 : 1

    })
  </script>

</body>

</html>
