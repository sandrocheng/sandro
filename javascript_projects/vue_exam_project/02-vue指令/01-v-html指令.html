<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Complatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>01-v-html指令</title>
  <script src="../lib/vue2.js"></script>
</head>

<body>
  <div id="app">
    <h1>{{msg}}</h1>
    <h1 v-html="msg"></h1>
  </div>

  <script>
    const app = new Vue({
      el: "#app",
      data: {
        msg: `
          <a href="http://www.baidu.com">
            百度
          </a>
        `
      }
    })
  </script>

</body>

</html>
