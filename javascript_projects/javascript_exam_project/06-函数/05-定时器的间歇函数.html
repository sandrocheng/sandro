  <title>05-定时器的间歇函数</title>

</head>

<body>
  <script>
    let count = 0

    function funInter() {
      console.log(count++);
      if (count > 5) {
        console.log("停止定时器");
        clearInterval(timerId)
      }
    }
    let timerId = setInterval(funInter, 1000)
  </script>
</body>
