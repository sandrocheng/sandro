  <title>06-回调函数</title>

</head>

<body>
  <script>
    function callback(result) {
      console.log(result);
    }
    function sum(x, y, callbackFun) {
      callbackFun(x + y)
    }
    sum(1, 2, callback)
  </script>
</body>
