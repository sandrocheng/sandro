<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Complatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>01-赋值运算符</title>

</head>

<body>
  <script>
    let num = 100
    num += 10
    console.log(`1) num = ${num}`);

    num++
    console.log(`2) num = ${num}`);

    num = 1
    console.log(`3)num=1, ++num + 1 = ${++num + 1} , num=${num}`);

    num = 1
    console.log(`4)num=1, num++ + 1 = ${num++ + 1} , num=${num}`);

  </script>
</body>

</html>
