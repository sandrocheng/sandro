<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Complatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>03-逻辑运算符</title>

</head>

<body>
  <script>
    let num = 10
    console.log(`num = ${num}`);
    console.log(`1)num > 0 && num < 100 ,结果：${num > 0 && num < 100}`);
    console.log(`2) !(num > 0 && num < 100) ,结果：${!(num > 0 && num < 100)}`);
    console.log(`3) 11 && 22 ,结果：${11 && 22}`);
    console.log(`4) 0 || 22 ,结果：${0 || 22}`);
    console.log(`5) 11 || 22 ,结果：${11 || 22}`);

    let str1 = '';
    let str2 = 'hello'
    console.log(`5) str1 || str2 ,结果：${str1 || str2}`);

    console.log(`6) 空串的boolean值：${Boolean('')}`);
    console.log(`7) 0的boolean值：${Boolean(0)}`);
    console.log(`8) undefined的boolean值：${Boolean(undefined)}`);
    console.log(`9) null的boolean值：${Boolean(null)}`);
    console.log(`9) NaN的boolean值：${Boolean(NaN)}`);
  </script>
</body>

</html>
