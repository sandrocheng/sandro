<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Complatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>11-监听整个页面的滚动事件</title>

  <style>
    body {
      height: 3000px;
    }
  </style>

  <script>
    (function () {
      function loadFinish() {
        window.addEventListener('scroll', function (e) {
          //获取<html>元素的写法:document.documentElement
          console.log(`整个页面向上移动了${document.documentElement.scrollTop}像素`);
        })
      }
      document.addEventListener('DOMContentLoaded', loadFinish)
    })()

  </script>
</head>

<body>

</body>

</html>
