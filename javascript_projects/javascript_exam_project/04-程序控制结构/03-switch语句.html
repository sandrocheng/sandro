<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Complatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>03-switch语句</title>

</head>

<body>
  <script>
    let num = 5
    switch (num) {
      case 1:
        console.log("星期一")
        break
      case 2:
        console.log("星期二")
        break
      case 3:
        console.log("星期三")
        break
      case 4:
        console.log("星期四")
        break
      case 5:
        console.log("星期五")
        break
      case 6:
        console.log("星期六")
        break
      case 7:
        console.log("星期日")
        break
      default:
        console.log("请输入1~7的数字")
    }
  </script>
</body>

</html>
