<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Complatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>05-环境对象</title>


</head>

<body>

  <button>点击</button>
  <script>
    function fun() {
      console.log(`普通函数中的环境对象this是`);
      console.dir(this)
    }
    fun()

    const btn = document.querySelector('button')
    btn.addEventListener('click', function (e) {
      console.log(`点击函数的环境对象this是：`);
      console.dir(this)
      this.style.color = 'red'

    })
  </script>
</body>

</html>
