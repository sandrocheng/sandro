<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Complatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>01-对象的基本使用</title>

</head>

<body>
  <script>

    let user = {
      'user-address': '大连',
      uname: 'lily',
      age: 18,
      gender: '女'
    }
    console.log("1) user:", user);
    console.log(`2) user type: ${typeof user}`);
    console.log(`3) user.uname : ${user.uname}`);
    console.log(`4) user.user-address : ${user['user-address']}`);

    user.uname = 'lucy'
    console.log("5) user:", user);

    user.num = 1
    console.log("6) user:", user);

    delete user.gender
    console.log("7) user:", user);
  </script>
</body>

</html>
