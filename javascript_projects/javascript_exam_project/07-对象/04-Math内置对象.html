<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Complatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>04-Math内置对象</title>

</head>

<body>
  <script>
    /*
     * 获取从[x,y)之间的随机数
     */
    function getIntRandom(min = 0, max = 0) {
      if (min === max) {
        return min
      }
      return Math.floor(Math.random() * (max - min)) + min
    }

    console.log(`1) Math.PI = ${Math.PI}`);
    console.log(`2) 1.1 向上取整 ：${Math.ceil(1.1)}`)
    console.log(`3) 1.1 向下取整 ：${Math.floor(1.1)}`)
    console.log(`4) 1.1 四舍五入取整 ：${Math.round(1.1)}`)
    console.log(`5) 1.6 四舍五入取整 ：${Math.round(1.6)}`)
    console.log(`6) 10,23,13,5,9 中最大的值是 ：${Math.max(10, 23, 13, 5, 9)}`)
    console.log(`7) 10,23,13,5,9 中最小的值是 ：${Math.min(10, 23, 13, 5, 9)}`)
    console.log(`8) -1.6 的绝对值 ：${Math.abs(-1.6)}`)
    console.log(`9) 2的3次方 ：${Math.pow(2, 3)}`)
    console.log(`10) 25的平方根 ：${Math.sqrt(25)}`)

    let random = Math.random()
    console.log(`11) [0,1) 随机小数：${random}`)
    console.log(`12) [0,10] 随机整数：${Math.floor(random * (10 + 1))}`)
    console.log(`13) [5,10) 随机整数：${getIntRandom(5, 10)}`)
  </script>
</body>

</html>
