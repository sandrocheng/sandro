<!DOCTYPE html>

  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>08-操作H5的自定义属性</title>
  <style>

  </style>

</head>

<body>
  <div data-num="1" data-en_num="one">一</div>
  <div data-num="2" data-en_num="two">二</div>
  <div data-num="3" data-en_num="three">三</div>
  <script>
    const divAll = document.querySelectorAll('div')
    for (let i = 0; i < divAll.length; i++) {
      console.log(`div[${i}].num = ${divAll[i].dataset.num} div[${i}].en_num = ${divAll[i].dataset.en_num} `);

    }
  </script>
</body>
